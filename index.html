<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101b2c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Voyage Driver"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png"><link rel="stylesheet" href="style.css"><title>Voyage Driver Schedule</title></head><body><main><header><small>VOYAGE SWISS</small><h1>Driver Schedule</h1><p>Private · Offline ready</p></header><section class="panel"><h2 id="formtitle">New assignment</h2><form id="form"><label>Date<input id="date" type="date" required></label><label>Driver name<input id="driver" maxlength="100" required placeholder="Driver name"></label><label>Vehicle<input id="car" list="cars" required placeholder="Vehicle"><datalist id="cars"><option>Mercedes V-Class</option><option>Mercedes S-Class</option><option>Mercedes E-Class</option><option>Mercedes Vito</option><option>Mercedes Sprinter</option><option>BMW X7</option><option>Range Rover</option></datalist></label><div class="actions"><button type="submit" id="save">Save assignment</button><button type="button" class="secondary" id="cancel" hidden>Cancel</button></div></form></section><section class="panel"><div class="heading"><h2>Today's drivers</h2><span id="todaylabel"></span></div><div id="today"></div></section><section class="panel"><div class="heading"><h2>All assignments</h2><input id="filter" type="date" aria-label="Filter by date"></div><div id="all"></div><button id="clearfilter" class="secondary">Show all dates</button></section><section class="panel"><h2>Backup</h2><p>Save a backup to Files regularly. iPhone may remove browser data.</p><div class="actions"><button id="export" type="button">Export backup</button><label class="import">Import backup<input type="file" id="import" accept="application/json,.json" hidden></label></div></section><footer id="status">Works offline after first successful load.</footer></main><script src="app.js"></script></body></html>
